{
  "schema_version": "1.1",
  "name": "subagent-driven-development-no-trigger",
  "description": "Baseline: a near-miss in the same domain that should not load the subagent-driven-development skill.",
  "tags": [
    "no-trigger"
  ],
  "execution": {
    "prompt": "Rename the variable cnt to count inside this single function.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?subagent-driven-development\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    }
  ]
}
