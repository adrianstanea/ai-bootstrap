{
  "schema_version": "1.1",
  "name": "graphviz-diagrams-no-trigger",
  "description": "Baseline: a near-miss in the same domain that should not load the graphviz-diagrams skill.",
  "tags": [
    "no-trigger"
  ],
  "execution": {
    "prompt": "Make a Mermaid sequence diagram of the pull request flow for the README.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?graphviz-diagrams\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    }
  ]
}
