{
  "schema_version": "1.1",
  "name": "git-commit-messages-trigger",
  "description": "Baseline: a realistic request that should load the git-commit-messages skill.",
  "tags": [
    "trigger"
  ],
  "execution": {
    "prompt": "I fixed an overflow in the ring buffer when the write index wraps. Write the commit message for that change.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?git-commit-messages\""
    }
  ]
}
