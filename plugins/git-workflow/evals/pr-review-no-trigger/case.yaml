{
  "schema_version": "1.1",
  "name": "pr-review-no-trigger",
  "description": "Baseline: a near-miss in the same domain that should not load the pr-review skill.",
  "tags": [
    "no-trigger"
  ],
  "execution": {
    "prompt": "What is the difference between `git diff main...HEAD` and `git diff main..HEAD`?",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pr-review\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    }
  ]
}
